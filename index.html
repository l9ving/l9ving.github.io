<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="loving's social links">
  <title>fawn</title>
  <link rel="icon" type="image/png" href="wings.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="stage" id="stage">
      <!-- The intro heart remains centered for one second, then crossfades smoothly into the socials. -->
      <span class="heart-intro" id="heart-intro" aria-hidden="true">♡</span>

      <nav class="social-list" id="social-list" aria-label="Social links" aria-hidden="true" inert>
        <a class="social-link" href="https://www.twitch.tv/loving" target="_blank" rel="noopener noreferrer" aria-label="Twitch @loving">
          <img src="icon-twitch.png" alt="" class="social-icon" width="20" height="20">
          <span>@loving</span>
        </a>
        <a class="social-link" href="https://x.com/lpving" target="_blank" rel="noopener noreferrer" aria-label="X @lpving">
          <img src="icon-x.png" alt="" class="social-icon" width="20" height="20">
          <span>@lpving</span>
        </a>
        <a class="social-link" href="https://www.tiktok.com/@l.ov.ing" target="_blank" rel="noopener noreferrer" aria-label="TikTok @l.ov.ing">
          <img src="icon-tiktok.png" alt="" class="social-icon" width="20" height="20">
          <span>@l.ov.ing</span>
        </a>
        <a class="social-link" href="https://www.youtube.com/@lpving" target="_blank" rel="noopener noreferrer" aria-label="YouTube @lpving">
          <img src="icon-youtube.png" alt="" class="social-icon" width="20" height="20">
          <span>@lpving</span>
        </a>
        <a class="social-link" href="https://discord.gg/heart" target="_blank" rel="noopener noreferrer" aria-label="Discord /heart">
          <img src="icon-discord.png" alt="" class="social-icon" width="20" height="20">
          <span>/heart</span>
        </a>
        <a class="social-link" href="https://throne.com/cuter" target="_blank" rel="noopener noreferrer" aria-label="Throne @cuter">
          <img src="icon-throne.png" alt="" class="social-icon" width="20" height="20">
          <span>@cuter</span>
        </a>
        <button class="social-link code-link" type="button" id="copy-code" aria-label="Copy creator code wuvabl">
          <img src="icon-heart.png" alt="" class="social-icon" width="20" height="20">
          <span>code "wuvabl"</span>
        </button>
      </nav>
    </div>
  </main>
  <noscript><style>.heart-intro{display:none}.social-list{visibility:visible!important;opacity:1!important;transform:none!important;pointer-events:auto!important}</style></noscript>
</body>
</html>
