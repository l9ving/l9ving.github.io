<!doctype html>
<html lang="en">
<head>

  <title>loving</title>

<body>
  <main class="page">

        </a>
        <a class="social" href="https://x.com/lpving" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X @lpving">
          <img class="social-icon" src="x.svg" alt="" width="18" height="18" aria-hidden="true">
          <span class="tooltip">@lpving</span>
        </a>
        <a class="social" href="https://www.tiktok.com/@l_venote" target="_blank" rel="noopener noreferrer" aria-label="TikTok @l_venote">

          <span class="tooltip">@l_venote</span>
        </a>
        <a class="social" href="https://www.youtube.com/@lpving" target="_blank" rel="noopener noreferrer" aria-label="YouTube @lpving">

          <span class="tooltip">@lpving</span>
        </a>
        <a class="social" href="https://discord.gg/heart" target="_blank" rel="noopener noreferrer" aria-label="Discord /heart">

          <span class="tooltip">/heart</span>
        </a>
        <a class="social" href="https://throne.com/cuter" target="_blank" rel="noopener noreferrer" aria-label="Throne @cuter">
          <img class="social-icon" src="throne.svg" alt="" width="18" height="18" aria-hidden="true">
          <span class="tooltip">@cuter</span>
        </a>
      </nav>

     
    </section>
  </main>

  <!-- website audio -->
  <audio id="audioPlayer" preload="auto" src="never_again.mp3" autoplay loop></audio>

  <script src="main.js" defer></script>
