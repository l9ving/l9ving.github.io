<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="loving — minimal soft grey links">
  <title>loving</title>
  <link rel="icon" type="image/png" href="favicon-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="center" aria-label="loving links">
      <nav class="socials" aria-label="Social platforms">
        <a class="social" href="https://www.twitch.tv/loving" target="_blank" rel="noopener noreferrer" aria-label="Twitch @loving">
          <img class="social-icon" src="twitch.svg" alt="" width="18" height="18" aria-hidden="true">
          <span class="tooltip">@loving</span>
        </a>
        <a class="social" href="https://x.com/lpving" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X @lpving">
          <img class="social-icon" src="x.svg" alt="" width="18" height="18" aria-hidden="true">
          <span class="tooltip">@lpving</span>
        </a>
        <a class="social" href="https://www.tiktok.com/@l_venote" target="_blank" rel="noopener noreferrer" aria-label="TikTok @l_venote">
          <img class="social-icon" src="tiktok.svg" alt="" width="18" height="18" aria-hidden="true">
          <span class="tooltip">@l_venote</span>
        </a>
        <a class="social" href="https://www.youtube.com/@lpving" target="_blank" rel="noopener noreferrer" aria-label="YouTube @lpving">
          <img class="social-icon" src="youtube.svg" alt="" width="18" height="18" aria-hidden="true">
          <span class="tooltip">@lpving</span>
        </a>
        <a class="social" href="https://discord.gg/heart" target="_blank" rel="noopener noreferrer" aria-label="Discord /heart">
          <img class="social-icon" src="discord.svg" alt="" width="18" height="18" aria-hidden="true">
          <span class="tooltip">/heart</span>
        </a>
        <a class="social" href="https://throne.com/cuter" target="_blank" rel="noopener noreferrer" aria-label="Throne @cuter">
          <img class="social-icon" src="throne.svg" alt="" width="18" height="18" aria-hidden="true">
          <span class="tooltip">@cuter</span>
        </a>
      </nav>

      <button id="copy-code" class="code" type="button" aria-label="Copy code wuvabl" title="Copy code wuvabl">
        <span class="code-label" aria-hidden="true">use code wuvabl</span>
        <span class="code-icon" aria-hidden="true">
          <svg class="code-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.8"/><path d="M16 8V5.5C16 4.67 15.33 4 14.5 4h-9C4.67 4 4 4.67 4 5.5v9c0 .83.67 1.5 1.5 1.5H8"/></svg>
          <svg class="code-check" viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17.5 19.5 7"/></svg>
        </span>
      </button>
      <span class="sr-only" id="copy-status" role="status" aria-live="polite"></span>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- Put your own never_again.mp3 file alongside index.html in the site root. -->
  <audio id="audioPlayer" preload="auto" src="never_again.mp3" autoplay loop></audio>

  <script src="main.js" defer></script>
</body>
</html>
