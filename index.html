<style>
  /* This page is fully self-contained: old style.css and main.js files are not used. */
  :root { color-scheme: light; --paper: #ffffff; --ink: #969696; --ink-hover: #707070; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); }
  body { color: var(--ink); font-family: 'Pixelify Sans', monospace; }
  main { min-height: 100vh; min-height: 100dvh; padding: 20px 16px; display: flex; align-items: center; justify-content: center; }
  /* A fixed-size stage keeps the heart and the finished links at the SAME center point. */
  .stage { position: relative; width: min(100%, 242px); height: 304px; flex: none; }
  .intro, .socials { position: absolute; inset: 0; }
  /* Both layers share the same centered stage. The heart is never hidden
     until its opacity animation has fully completed. */
  .intro { display: flex; align-items: center; justify-content: center;
           opacity: 1; visibility: visible; pointer-events: none; }
  .intro-heart { font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'Apple Symbols',
                 'DejaVu Sans', sans-serif; font-size: 44px; line-height: 1;
                 font-weight: 400; font-variant-emoji: text; color: var(--ink);
                 user-select: none; }
  .socials { display: flex; flex-direction: column; align-items: stretch;
             justify-content: center; gap: 1px; opacity: 0; visibility: hidden;
             pointer-events: none; transform: translateY(5px); }

  /* Real intermediate opacity values make the heart visibly grow lighter. */
  @keyframes heartFadeAway {
     0% { opacity: 1; }
     20% { opacity: .95; }
     45% { opacity: .68; }
     70% { opacity: .30; }
     90% { opacity: .07; }
     100% { opacity: 0; }
  }
  @keyframes socialsFadeIn {
      0% { opacity: 0; transform: translateY(5px); }
      30% { opacity: .20; }
      65% { opacity: .70; }
     100% { opacity: 1; transform: translateY(0); }
  }
  .stage.fading .intro { animation: heartFadeAway 1250ms ease-in-out forwards; }
  .stage.fading .socials { visibility: visible; pointer-events: auto;
    animation: socialsFadeIn 1000ms ease-in-out 310ms both; }
  .stage.complete .intro { visibility: hidden; }
  .social { width: 100%; min-height: 34px; padding: 4px 3px; display: grid; grid-template-columns: 18px auto;
            align-items: center; justify-content: start; column-gap: 12px; border: 0;
            background: transparent; color: var(--ink); text-decoration: none; white-space: nowrap;
            font-family: 'Pixelify Sans', monospace; font-size: 16px; font-weight: 400;
            line-height: 1.2; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .social:hover { color: var(--ink-hover); opacity: .8; }
  .social:focus-visible { outline: 1px dotted #969696; outline-offset: 3px; }
  .logo { display: block; width: 18px; height: 18px; object-fit: contain; }
  @media (max-width: 420px) { .social { min-height: 42px; } .stage { height: 326px; } }
  /* Even on systems requesting reduced motion, keep a gentle, shorter fade. */
  @media (prefers-reduced-motion: reduce) {
    .stage.fading .intro { animation-duration: 700ms; }
    .stage.fading .socials { animation-duration: 650ms; animation-delay: 150ms; }
  }
</style>
<noscript><style>.intro{display:none!important}.socials{opacity:1!important;visibility:visible!important;pointer-events:auto!important;transform:none!important}</style></noscript>

<script>
/* CSS keyframes fade opacity; inline script starts them after first paint. */
(() => {
  const stage = document.querySelector('.stage');
  const heart = document.querySelector('.intro');
  const socials = document.getElementById('socials');
  // Wait for paint and a short hold before beginning the genuine opacity fade.
  let started = false;
  const begin = () => {
    if (started) return;
    if (document.hidden) {
      document.addEventListener('visibilitychange', begin, { once: true });
      return;
    }
    started = true;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      setTimeout(() => {
        socials.inert = false;
        socials.removeAttribute('aria-hidden');
        stage.classList.add('fading');
        // Hide only after the last frame has reached opacity 0.
        heart.addEventListener('animationend', (event) => {
          if (event.animationName === 'heartFadeAway') stage.classList.add('complete');
        }, { once: true });
      }, 950);
    }));
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', begin, { once: true });
  } else begin();
  const copyButton = document.getElementById('copyCode');
  copyButton.addEventListener('click', async () => {
    let copied = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText('wuvabl');
        copied = true;
      }
    } catch (err) { /* use fallback */ }
    if (!copied) {
      const input = document.createElement('textarea');
      input.value = 'wuvabl';
      input.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(input);
      input.select();
      try { document.execCommand('copy'); } catch (err) { /* unsupported browser */ }
      input.remove();
    }
    // Intentionally no confirmation toast or popup.
  });
  // Discourage casual copying; this does not make website source private.
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('keydown', event => {
    const key = event.key.toLowerCase();
    const mod = event.ctrlKey || event.metaKey;
    if (key === 'f12' || (mod && ['u','s'].includes(key)) ||
       (mod && event.shiftKey && ['i','j','c'].includes(key)) ||
       (event.metaKey && event.altKey && ['i','j','c'].includes(key))) event.preventDefault();
  }, true);
})();
</script>
